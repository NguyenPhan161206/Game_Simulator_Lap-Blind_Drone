[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-drone-lab"
version = "0.0.0"
description = "Camera-free drone navigation simulation research scaffold"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["blind_drone*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["README.md"]
