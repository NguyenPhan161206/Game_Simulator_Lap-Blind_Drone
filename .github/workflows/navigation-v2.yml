name: Navigation v2
on:
  push:
    branches: ["main", "feat/navigation-v2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and generated world
        run: |
          python3 tools/check_scaffold.py
          python3 tools/build_lab.py --check
          python3 tools/build_scenarios.py --check
          python3 tools/build_navigation_v2.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install official pinned Webots archive
        run: python3 tools/install_webots.py
      - name: Candidate or frozen development
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_navigation_v2.py --output artifacts/v2-development --software-rendering --no-rendering --timeout 1500
      - name: Check predeclared development criterion before fresh splits
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,"src")
          from blind_drone.evaluation.study_v2 import development_goal
          result=json.load(open("artifacts/v2-development/result.json"))
          goal=development_goal(result["episodes"])
          print("V2_DEVELOPMENT_CRITERION",goal)
          assert goal["met"], "Development criterion not met; fresh splits remain closed"
          PY
      - name: Frozen validation
        run: |
          if [ -f configs/scenarios/protocol_v2.lock.json ]; then
            xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_navigation_v2.py --split validation --output artifacts/v2-validation --software-rendering --no-rendering --timeout 1500
          fi
      - name: Frozen test without tuning
        run: |
          if [ -f configs/scenarios/protocol_v2.lock.json ]; then
            xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_navigation_v2.py --split test --output artifacts/v2-test --software-rendering --no-rendering --timeout 1500
          fi
      - name: Report all outcomes
        if: always()
        run: |
          python3 tools/report_navigation_v2.py artifacts/v2-development
          python3 tools/report_navigation_v2.py artifacts/v2-validation
          python3 tools/report_navigation_v2.py artifacts/v2-test
      - name: Validate complete frozen study
        run: |
          if [ -f configs/scenarios/protocol_v2.lock.json ]; then
            python3 tools/check_navigation_v2.py artifacts/v2-development/result.json artifacts/v2-validation/result.json artifacts/v2-test/result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-v2-evidence
          path: |
            artifacts/v2-*/
            artifacts/v2-study.json
          if-no-files-found: warn
