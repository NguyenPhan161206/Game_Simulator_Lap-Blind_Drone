name: Separate sensor development pilots
on:
  push:
    branches: ["feat/7a-sensor-pilots-v1"]
    paths: ["versions/sensor_pilots_v1/**", "simulation/webots/controllers/*sensor_pilots/**", "tools/*sensor_pilots.py", "tests/test_sensor_pilots.py", ".github/workflows/sensor-pilots.yml", "docs/research/2026-11-02-retention-cold.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        study: [adaptive, sparse]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require completed retention report before sensor pilots
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open('docs/research/2026-11-02-retention-cold.json'))
          assert result['complete'] and result['raw_audit_passed'] and result['episodes']==352
          PY
      - name: Check frozen protocols and additive sensor pilot source
        run: make check
      - name: Materialize exposed development fixtures only
        run: python3 tools/build_sensor_pilots.py
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Real legacy smoke and navigation regression
        run: |
          xvfb-run -a python3 tools/run_webots.py --smoke --software-rendering --output artifacts/aa-legacy-smoke
          xvfb-run -a python3 tools/run_webots.py --navigation --software-rendering --output artifacts/aa-legacy-navigation
      - name: Separate sensor development pilots; preserve all outcomes
        run: xvfb-run -a python3 tools/run_sensor_pilots.py --study ${{ matrix.study }} --output artifacts/sensor-pilots
      - name: Independent raw replay and sensor comparison
        run: python3 tools/review_sensor_pilots.py artifacts/sensor-pilots --study ${{ matrix.study }} --expected-source "$GITHUB_SHA" --output artifacts/sensor-pilots-review.json
      - name: Record pipeline completion separately from equivalence outcome
        run: |
          python3 - <<'PY'
          import json,os
          result=json.load(open('artifacts/sensor-pilots-review.json'))
          assert result['complete'] and result['raw_audit_passed'] and result['episodes']==(48 if result['study']=='adaptive' else 72)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('Development sensor pilot only.\n\n```json\n'+json.dumps(result['summary'],indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensor-pilots-${{ matrix.study }}
          path: |
            artifacts/sensor-pilots/
            artifacts/sensor-pilots-review.json
            artifacts/aa-legacy-smoke/
            artifacts/aa-legacy-navigation/
          if-no-files-found: warn
