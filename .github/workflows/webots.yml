name: Webots minimal lab
on:
  push:
    branches: ["main", "feat/webots-lab-v1", "feat/navigation-v1"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and generated world
        run: |
          python3 tools/check_scaffold.py
          python3 tools/build_lab.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install official pinned Webots archive
        run: python3 tools/install_webots.py
      - name: Run actual simulator checks
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_webots.py --smoke --software-rendering --output artifacts/webots-smoke --timeout 180
      - name: Report generated observer evidence
        if: always()
        run: python3 tools/report_webots_evidence.py artifacts/webots-smoke
      - name: Run paired navigation diagnostics in actual Webots
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_webots.py --navigation --software-rendering --output artifacts/navigation --timeout 600
      - name: Report navigation diagnostics
        if: always()
        run: python3 tools/report_webots_evidence.py artifacts/navigation
      - name: Save simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webots-smoke-evidence
          path: |
            artifacts/webots-smoke/
            artifacts/navigation/
          if-no-files-found: warn
