name: Local session collector
on:
  push:
    branches: ["main", "feat/local-acceptance"]
    paths: ["tools/local_session.py", "tests/test_local_session.py", ".github/workflows/local-session.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate core, evidence checks and frozen protocols
        run: make check
      - name: Install simulator display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install official Webots R2025a
        run: python3 tools/install_webots.py
      - name: Run mapped collector in real Webots under virtual display
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/local_session.py mapped --no-interview --software-rendering --output artifacts/ci-collector-mapped --timeout 180
      - name: Check manual collector telemetry and timeout cleanup without keyboard automation
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/local_session.py manual --no-interview --software-rendering --output artifacts/ci-collector-manual --timeout 20
          code=$?
          set -e
          test "$code" -eq 1
      - name: Verify collector evidence and report exact source
        run: |
          python3 - <<'PY'
          import json, pathlib
          def read(mode, name):
              return json.loads((pathlib.Path('artifacts/ci-collector-'+mode)/name).read_text())
          mapped=read('mapped','review.json'); manual=read('manual','review.json')
          ms=read('mapped','session.json'); hs=read('manual','session.json')
          assert mapped['comparison']['identity_valid'] and mapped['comparison']['same_outcome']
          assert ms['exit_code']==0 and ms['status']=='process_exited'
          assert hs['status']=='timeout' and hs['exit_code'] is not None
          assert manual['telemetry']['packets']>0 and not manual['telemetry']['invalid_lines']
          assert ms['source_commit']==hs['source_commit'] and not ms['working_tree_dirty'] and not hs['working_tree_dirty']
          for review in (mapped,manual):
              assert not review['gui_verified_automatically'] and not review['operator_record_present']
          evidence={'source_commit':ms['source_commit'],'kind':'CI_Xvfb_collector_integration_not_desktop_acceptance',
                    'mapped':mapped,'manual':manual}
          pathlib.Path('artifacts/collector-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('LOCAL_HELPER_EVIDENCE '+json.dumps(evidence,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-session-collector-evidence
          path: |
            artifacts/ci-collector-*/
            artifacts/collector-evidence.json
          if-no-files-found: warn
