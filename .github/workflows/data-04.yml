name: DATA-04 hit-ttl persistent map development
on:
  push:
    branches: ["feat/data-04-hit-ttl"]
    paths: ["versions/data_history_v1/**", "simulation/webots/controllers/*data04/**", "simulation/webots/protos/BlindDroneData04.proto", "simulation/webots/worlds/occupied_hit_ttl_data04.wbt", "tools/*data04.py", "tests/test_data04.py", "Makefile"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frozen protocols and versioned DATA-04 source
        run: make check
      - name: Materialize exposed development fixtures only
        run: |
          python3 tools/build_navigation_v4.py
          python3 tools/build_data04.py
      - name: Install simulator display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Paired 32 ms development with hit-ttl candidate
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_data04.py --output artifacts/data04-hit-ttl
      - name: Independently replay complete raw evidence
        run: python3 tools/review_data04.py artifacts/data04-hit-ttl --expected-source "$GITHUB_SHA" --output artifacts/data04-review.json
      - name: Upload raw study for local verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data04-hit-ttl-development
          path: artifacts/data04-hit-ttl/
          if-no-files-found: warn
