name: Range cadence v3 development
on:
  push:
    branches: ["main", "feat/range-cadence-v3-runtime"]
    paths: ["src/**", "tools/**", "tests/**", "configs/**", "simulation/**", "Makefile", ".github/workflows/research-v3.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source, all three frozen designs and v3 runtime
        run: make check
      - name: Materialize committed case fixtures
        run: python3 tools/build_research_v3.py
      - name: Install simulator display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Run full development split only; preserve all outcomes
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_research_v3.py --output artifacts/ci-v3-development
      - name: Verify complete development and independent raw replay
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/ci-v3-development/result.json'))
          assert r['split']=='development' and r['status']=='complete' and r['complete_split']
          assert len(r['episodes'])==240 and r['integrity_passed']
          assert not r['working_tree_dirty']
          assert all(a.get('raw_integrity_passed') for a in r['attempts'] if a['classification']=='valid')
          print('V3_DEVELOPMENT_EVIDENCE',json.dumps({k:r[k] for k in ('source_commit','design_sha256','runtime_sha256','gate')},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-cadence-v3-development
          path: artifacts/ci-v3-development/
          if-no-files-found: warn
