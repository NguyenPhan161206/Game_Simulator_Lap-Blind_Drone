name: Frozen range cadence v3 validation
on:
  workflow_dispatch:
    inputs:
      expected_runtime_sha256:
        description: "Exact reviewed additive runtime lock digest"
        required: true
        default: "bcc938bb18acd9bd829f43e6f0f722f204a5c7702e5fa3b20c82b6171a080c3d"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-range-cadence-v3-validation
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source and immutable designs/runtime
        run: make check
      - name: Require reviewed lock and first dispatch before any held-out navigation
        env:
          EXPECTED_RUNTIME: ${{ inputs.expected_runtime_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/v3-validation-meta
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/research-v3-validation.yml/runs?event=workflow_dispatch&per_page=100" > artifacts/v3-validation-dispatches.json
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0,'src')
          from blind_drone.experiments.runtime_v3 import verify_runtime,git
          from blind_drone.experiments.protocol_v3 import verify_ledger
          assert verify_runtime()==os.environ['EXPECTED_RUNTIME'], 'Runtime lock changed'
          assert not git('status','--porcelain'), 'Held-out must start from a clean source'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1', 'Never rerun held-out jobs to obtain a better outcome'
          runs=json.load(open('artifacts/v3-validation-dispatches.json'))['workflow_runs']
          previous=[r['id'] for r in runs if str(r['id'])!=os.environ['GITHUB_RUN_ID']]
          pathlib.Path('artifacts/v3-validation-meta/dispatch.json').write_text(json.dumps({
              'run_id':os.environ['GITHUB_RUN_ID'],'source':os.environ['GITHUB_SHA'],
              'runtime_sha256':os.environ['EXPECTED_RUNTIME'],'other_dispatch_ids':previous})+'\n')
          assert not previous, 'A prior/other dispatch exists: review exposure, do not start another validation automatically'
          verify_ledger()
          ledger=json.load(open('configs/scenarios/exposure_v3.json'))
          assert not any(e['navigation_executed'] and 'validation' in e['splits'] for e in ledger['events']), 'Validation already exposed'
          PY
      - name: Materialize registered fixtures without policy outcomes
        run: python3 tools/build_research_v3.py
      - name: Install simulator display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Run exactly the registered complete validation on one host
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_research_v3.py --split validation --output artifacts/ci-v3-validation
      - name: Review hashes, full raw replay and prespecified gates
        run: python3 tools/review_research_v3.py artifacts/ci-v3-validation --expected-split validation --expected-source "$GITHUB_SHA"
      - name: Report research outcome independently of job success
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/ci-v3-validation/review.json'))
          assert r['complete'] and r['raw_audit_passed'] and r['episodes']==480
          summary={k:v for k,v in r.items() if k!='gate'}
          summary['gate']={k:v for k,v in r['gate'].items() if k not in ('collapsed','by_family')}
          summary['test_executed']=False
          print('V3_VALIDATION_EVIDENCE '+json.dumps(summary,separators=(',',':')))
          PY
      - name: Preserve exposure and exact source even on incomplete execution
        if: always()
        run: |
          mkdir -p artifacts/v3-validation-meta
          cp configs/scenarios/exposure_v3.json artifacts/v3-validation-meta/exposure_after.json
          git rev-parse HEAD > artifacts/v3-validation-meta/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-cadence-v3-validation
          path: |
            artifacts/ci-v3-validation/
            artifacts/v3-validation-meta/
          if-no-files-found: warn
