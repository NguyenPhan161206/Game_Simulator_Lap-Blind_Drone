name: Cold retention development
on:
  push:
    branches: ["feat/7a-retention-cold-v1"]
    paths: ["versions/retention_cold_v1/**", "simulation/webots/controllers/*retention/**", "simulation/webots/protos/BlindDroneRetention.proto", "simulation/webots/worlds/retention_cold_v1.wbt", "tools/*retention_cold.py", "tests/test_retention_cold.py", ".github/workflows/retention-cold.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frozen protocols and additive retention source
        run: make check
      - name: Materialize exposed development fixtures only
        run: python3 tools/build_retention_cold.py
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Real legacy smoke and navigation regression
        run: |
          xvfb-run -a python3 tools/run_webots.py --smoke --software-rendering --output artifacts/aa-legacy-smoke
          xvfb-run -a python3 tools/run_webots.py --navigation --software-rendering --output artifacts/aa-legacy-navigation
      - name: Cold retention development; preserve all outcomes
        run: xvfb-run -a python3 tools/run_retention_cold.py --output artifacts/retention-cold
      - name: Independent raw replay and retention comparison
        run: python3 tools/review_retention_cold.py artifacts/retention-cold --expected-source "$GITHUB_SHA" --output artifacts/retention-cold-review.json
      - name: Record pipeline completion separately from equivalence outcome
        run: |
          python3 - <<'PY'
          import json,os
          result=json.load(open('artifacts/retention-cold-review.json'))
          assert result['complete'] and result['raw_audit_passed'] and result['episodes']==352
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('Development retention only.\n\n```json\n'+json.dumps(result['summary'],indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-cold-development
          path: |
            artifacts/retention-cold/
            artifacts/retention-cold-review.json
            artifacts/aa-legacy-smoke/
            artifacts/aa-legacy-navigation/
          if-no-files-found: warn
