name: Sparse runtime equivalence preflight
on:
  push:
    branches: ["feat/7a-fresh-evaluation-v1"]
    paths: ["versions/efficiency_runtime_v1/**", "!versions/efficiency_runtime_v1/runtime.lock.json", "!versions/efficiency_runtime_v1/preflight-review.json", "simulation/webots/controllers/*efficiency/**", "tools/build_efficiency_runtime.py", "tools/run_efficiency.py", "tools/review_efficiency.py", "tests/test_efficiency_runtime.py", ".github/workflows/efficiency-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require first attempt and one fixed binding
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 tools/build_efficiency_runtime.py --check
      - name: Fetch prior qualified sparse raw evidence
        uses: actions/download-artifact@v4
        with:
          name: sensor-pilots-sparse
          run-id: 41383159235
          github-token: ${{ github.token }}
          path: artifacts/prior-sparse
      - name: Check frozen protocols and additive sensor pilot source
        run: make check
      - name: Materialize exposed development fixtures only
        run: python3 tools/build_efficiency_runtime.py
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libegl1 libopengl0 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libx11-xcb1 libxrender1 libxi6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxext6 libsndio7.0 libpulse0 libasound2 libzip4 libgtk-3-0 libatk1.0-0 libdbus-1-3 libfreeimage3 libxaw7 libxslt1.1 ffmpeg
      - name: Install pinned Webots R2025a
        run: python3 tools/install_webots.py
      - name: Real legacy smoke and navigation regression
        run: |
          xvfb-run -a python3 tools/run_webots.py --smoke --software-rendering --output artifacts/aa-legacy-smoke
          xvfb-run -a python3 tools/run_webots.py --navigation --software-rendering --output artifacts/aa-legacy-navigation
      - name: Sparse runtime equivalence preflight; preserve all outcomes
        run: xvfb-run -a python3 tools/run_efficiency.py --split development --output artifacts/efficiency-preflight
      - name: Independent raw replay and sensor comparison
        run: python3 tools/review_efficiency.py artifacts/efficiency-preflight --split development --prior-run artifacts/prior-sparse/sensor-pilots --expected-source "$GITHUB_SHA" --output artifacts/efficiency-preflight-review.json
      - name: Record pipeline completion separately from equivalence outcome
        run: |
          python3 - <<'PY'
          import json,os
          result=json.load(open('artifacts/efficiency-preflight-review.json'))
          assert result['complete'] and result['raw_audit_passed'] and result['episodes']==48 and result['preflight_equivalence']['met']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('Runtime port equivalence on exposed cases only; no held-out execution.\n\n```json\n'+json.dumps(result['summary'],indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efficiency-preflight-v1
          path: |
            artifacts/efficiency-preflight/
            artifacts/efficiency-preflight-review.json
            artifacts/aa-legacy-smoke/
            artifacts/aa-legacy-navigation/
          if-no-files-found: warn
